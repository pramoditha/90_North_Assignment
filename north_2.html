<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transform-origin: center;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #222;
            color: white;
            padding: 1rem;
            text-align: center;
            z-index: 1000;
        }

        .container {
            display: flex;
            flex-grow: 1;
            margin-top: 60px;
        }

        .left-menu {
            background-color: #f4f4f4;
            width: 200px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s ease-in-out;
        }

        .left-menu.collapsed {
            transform: translateX(-200px);
        }

        .main-content {
            flex-grow: 1;
            padding: 1rem;
            background-color: #fff;
        }

        .right-panel {
            width: 200px;
            background-color: #f4f4f4;
            padding: 1rem;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        .toggle-btn {
            position: absolute;
            top: 0;
            right: -30px;
            background-color: #333;
            color: white;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-menu,
            .right-panel {
                width: 100%;
                position: static;
                transform: none;
            }

            .left-menu.collapsed {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <nav>Fixed Navbar</nav>

    <div class="container">
        <div class="left-menu" id="leftMenu">
            <button class="toggle-btn" onclick="toggleMenu()">&#9776;</button>
            <p>Left Menu Content</p>
        </div>

        <div class="main-content">
            <center><h1>Main Content Area</h1></center>
        </div>

        <div class="right-panel">
            <h2>Right Panel</h2>
        </div>
    </div>

    <footer>Footer Content</footer>

    <script>
        function toggleMenu() {
            const leftMenu = document.getElementById('leftMenu');
            leftMenu.classList.toggle('collapsed');
        }

        // Function to adjust the page size based on screen width
        function adjustPageSize() {
            const width = window.innerWidth;
            const body = document.body;

            // Remove any previous scale transformation
            body.style.transform = 'none';
            body.style.transition = 'transform 0.3s ease';

            if (width >= 992 && width <= 1600) {
                body.style.transform = 'scale(0.9)';
            } else if (width >= 700 && width <= 767) {
                body.style.transform = 'scale(0.8)';
            } else if (width >= 600 && width <= 700) {
                body.style.transform = 'scale(0.75)';
            } else if (width <= 600) {
                body.style.transform = 'scale(0.5)';
            }
        }

        // Call the adjustPageSize function on resize and load
        window.addEventListener('resize', adjustPageSize);
        window.addEventListener('load', adjustPageSize);
    </script>
</body>
</html>
